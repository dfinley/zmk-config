manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
    - name: rolio
      url-base: https://github.com/Townk
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      clone-depth: 1
      import: app/west.yml
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: main
      clone-depth: 1
      path: modules/zmk-tri-state
    - name: zmk-rolio-shield
      remote: rolio
      revision: develop
      clone-depth: 1
      path: modules/zmk-rolio-shield
  self:
    path: config
